name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check core.js
          node --check render.js
          node --check app.js
      - name: Core tests
        run: node tests/core.test.js
      - name: Render pipeline tests
        run: node tests/render.test.js
      - name: Static security and DOM checks
        run: node tests/static.test.js
