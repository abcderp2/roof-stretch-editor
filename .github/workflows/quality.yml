name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check core.js
          node --check patch-render.js
          node --check render.js
          node --check app-base.js
          node --check app-patches.js
          node --check app-io.js
          node --check app.js
      - name: Core tests
        run: node tests/core.test.js
      - name: Render pipeline tests
        run: node tests/render.test.js
      - name: Static security and DOM checks
        run: node tests/static.test.js
      - name: App initialization smoke test
        run: node tests/app-smoke.test.js
